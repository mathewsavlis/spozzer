name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate public environment
        env:
          PUBLIC_LEADS_API_URL: ${{ vars.PUBLIC_LEADS_API_URL }}
          PUBLIC_WHATSAPP_NUMBER: ${{ vars.PUBLIC_WHATSAPP_NUMBER }}
          PUBLIC_EVENTS_API_URL: ${{ vars.PUBLIC_EVENTS_API_URL }}
        run: |
          if [ -z "$PUBLIC_LEADS_API_URL" ]; then
            echo "PUBLIC_LEADS_API_URL is missing"
            exit 1
          fi

          if [ -z "$PUBLIC_WHATSAPP_NUMBER" ]; then
            echo "PUBLIC_WHATSAPP_NUMBER is missing"
            exit 1
          fi

          if [ -z "$PUBLIC_EVENTS_API_URL" ]; then
            echo "PUBLIC_EVENTS_API_URL is missing"
            exit 1
          fi

      - name: Build Astro site
        uses: withastro/action@v5
        env:
          PUBLIC_LEADS_API_URL: ${{ vars.PUBLIC_LEADS_API_URL }}
          PUBLIC_WHATSAPP_NUMBER: ${{ vars.PUBLIC_WHATSAPP_NUMBER }}
          PUBLIC_EVENTS_API_URL: ${{ vars.PUBLIC_EVENTS_API_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4